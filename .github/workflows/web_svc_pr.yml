name: Web service CI

on:
  pull_request:
    branches:
      - master
    paths:
      - 'web/service/**'
      - '.github/workflows/web_svc_pr.yml'

# Pull requests build and test without secrets, so this also runs on fork and Dependabot
# pull requests. Production secrets are only downloaded by the deploy workflows.
permissions:
  contents: read

env:
    NODE_VERSION: "24"
    java_version: '17'
    java_distribution: 'zulu'

jobs:

  web_ci:
    name: Build web service
    runs-on: ubuntu-24.04

    env:
      ENV_NAME              : prd

    steps:

      - uses: actions/checkout@v7.0.1
        with:
          # We need to download all tags so that the axion-release-plugin
          # can resolve the most recent version tag.
          fetch-depth: 0

      - name: Set up JDK ${{ env.java_version }}-${{ env.java_distribution }}
        uses: actions/setup-java@v6.3.0
        with:
          # We need a recent version of Java with jpackage included.
          java-version: ${{ env.java_version }}
          # We use the zulu distribution, which is an OpenJDK distro.
          distribution: ${{ env.java_distribution }}

      # for npm
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # test and build, not webTest and webBuild: those first run webSecrets, which
      # downloads the production secrets with gcloud. The tests use src/test/resources.
      - name: run gradle tasks
        shell: bash
        run: |
          ENV_FILE=web/pipeline/${ENV_NAME}.env source web/pipeline/env-file.sh
          ./gradlew ':web:service:test' ':web:service:build'
