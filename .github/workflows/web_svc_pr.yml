name: Web service CI

on:
  pull_request:
    branches:
      - master
    paths:
      - 'web/service/**'
  workflow_dispatch:

env:
    java_version: '17'
    java_distribution: 'zulu'

jobs:

  web_ci:
    name: Build web service
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          # We need to download all tags so that the axion-release-plugin
          # can resolve the most recent version tag.
          fetch-depth: 0

      - name: Set up JDK ${{ env.java_version }}-${{ env.java_distribution }}
        uses: actions/setup-java@v5
        with:
          # We need a recent version of Java with jpackage included.
          java-version: ${{ env.java_version }}
          # We use the zulu distribution, which is an OpenJDK distro.
          distribution: ${{ env.java_distribution }}

      # No GCP login: tests and build do not need the deployment secrets, so
      # this job also works on pull requests from forks.
      - name: Test and build
        run: ./gradlew ':web:service:build'
