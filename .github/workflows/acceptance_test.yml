name: Rule acceptance tests
on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'Dockerfile'
      - '.gitignore'
      - 'LICENSE'
      - 'docker.yml'
      - 'formatting.yml'
      - 'test_pack_dock.yml'
      - 'triage.yml'
      - 'end_to_end.yml'
      - 'web/**'
      - '.github/workflows/web_**.yml'
      - '.github/workflows/stg_web_**.yml'
    types: [ opened, synchronize, reopened, ready_for_review ]
  # Manual runs, on a PR's branch, can validate every feed with master again so that all the
  # timings are compared within one job, compare the branch with another reference than master,
  # or validate the feeds of the whole Mobility Database catalog.
  workflow_dispatch:
    inputs:
      reuse_master_reports:
        description: 'Reuse master reports of unchanged feeds from earlier runs'
        type: boolean
        default: true
      baseline_ref:
        description: 'Branch, tag or commit to build the reference validator from (default: master)'
        type: string
        default: ''
      latest_ref:
        description: 'Branch, tag or commit to build the validator under test from (default: the branch the workflow runs on)'
        type: string
        default: ''
      feed_list:
        description: 'Feeds to validate: the acceptance test list, or the active or non-deprecated GTFS feeds of the Mobility Database catalog'
        type: choice
        options:
          - acceptance
          - active
          - non-deprecated
        default: acceptance
# Manual runs comparing different versions or feeds do not cancel each other.
concurrency:
  group: ${{ github.head_ref || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}-{1}-{2}', inputs.baseline_ref, inputs.latest_ref, inputs.feed_list) || '' }}
  cancel-in-progress: true

env:
  python_version: '3.11'
  java_version: '17'
  java_distribution: 'zulu'

jobs:
  fail_if_pull_request_is_draft: # Fails in order to indicate that pull request needs to be marked as ready to review to pass.
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if PR is a draft
        run: exit 1
  pre_ci:
    name: Prepare CI environment
    # Skip this job and its dependencies if the PR is draft. Manual runs have no PR.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1
        with:
          # We need to fetch with a depth of 2 for pull_request so we can do HEAD^2
          fetch-depth: 2

        # If this workflow was triggered by a pull request (open or synchronize!) then resolve the commit message from HEAD^2
        # It is stored in output steps, to be referenced with ${{ steps.pr_get_commit_message.outputs.pr_commit_message }}
      - name: "[Pull Request] Get commit message"
        if: github.event_name == 'pull_request'
        id: pr_get_commit_message
        # Obtain the last commit from the branch to merge (hence the HEAD^2).
        # In case of multi-line commit messages, remove any \n, because the GITHUB_OUTPUT method
        # of sending data to other jobs does not like them.
        run: echo "pr_commit_message=$(git log --format=%B -n 1 HEAD^2 | tr '\n' ' ')" >> $GITHUB_OUTPUT

    # For **Pull Request** events this will resolve to something like "$( [ -z "commit message pr" ] && echo "" || echo "commit message pr" )" which then resolves to just "commit message pr"
    outputs:
      commit_message: $( [ -z "${{ steps.pr_get_commit_message.outputs.pr_commit_message }}" ] || echo "${{ steps.pr_get_commit_message.outputs.pr_commit_message }}" )
  # Builds the validator under test: the branch, or the latest_ref of a manual run. The comparator
  # is always built from the branch.
  pack-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK ${{ env.java_version }}-${{ env.java_distribution }}
        uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ env.java_version }}
          distribution: ${{ env.java_distribution }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Package comparator jar with Gradle
        run: ./gradlew :output-comparator:shadowJar
      - name: Persist comparator snapshot jar
        uses: actions/upload-artifact@v7.0.2
        with:
          name: comparator-snapshot
          path: output-comparator/build/libs/output-comparator-*-cli.jar
      - name: Resolve latest commit
        id: latest
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha) \
            || { echo "::error::Cannot find the commit, branch or tag '$REF'."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        if: ${{ inputs.latest_ref }}
        env:
          REF: ${{ inputs.latest_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7.0.1
        if: ${{ inputs.latest_ref }}
        with:
          ref: ${{ steps.latest.outputs.sha }}
      - name: Package cli app jar with Gradle
        run: ./gradlew :cli:shadowJar
      - name: Check that the validator under test supports the acceptance tests
        if: ${{ inputs.latest_ref }}
        run: |
          usage=$(java -jar cli/build/libs/gtfs-validator-*-cli.jar --help 2>&1 || true)
          grep -q -- --skip_validator_update <<< "$usage" \
            || { echo "::error::The validator under test is too old: it has no --skip_validator_update option (added in #1683)."; exit 1; }
      - name: Persist gtfs-validator snapshot jar
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gtfs-validator-snapshot
          path: cli/build/libs/gtfs-validator-*-cli.jar
    outputs:
      latest_sha: ${{ steps.latest.outputs.sha || github.sha }}
  # Builds the reference validator: master, or the baseline_ref of a manual run. The job and its
  # artifact keep the master name.
  pack-master:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout only takes a full commit SHA, so a short SHA, branch or tag is resolved
      # first.
      - name: Resolve reference commit
        id: reference
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha) \
            || { echo "::error::Cannot find the commit, branch or tag '$REF'."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          REF: ${{ inputs.baseline_ref || 'master' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.reference.outputs.sha }}
      - name: Set up JDK ${{ env.java_version }}-${{ env.java_distribution }}
        uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ env.java_version }}
          distribution: ${{ env.java_distribution }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Package cli app jar with Gradle
        run: ./gradlew shadowJar
      # queue_runner.sh passes --skip_validator_update, which older validators reject on every feed.
      - name: Check that the reference validator supports the acceptance tests
        run: |
          usage=$(java -jar cli/build/libs/gtfs-validator-*-cli.jar --help 2>&1 || true)
          grep -q -- --skip_validator_update <<< "$usage" \
            || { echo "::error::The reference validator is too old: it has no --skip_validator_update option (added in #1683)."; exit 1; }
      - name: Persist gtfs-validator jar from master branch
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gtfs-validator-master
          path: cli/build/libs/gtfs-validator-*-cli.jar
    outputs:
      master_sha: ${{ steps.reference.outputs.sha }}
  fetch-urls:
    if: "!contains(needs.pre_ci.outputs.commit_message, '[acceptance test skip]')"
    needs: pre_ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.python_version }}
      - name: Install dependencies
        run: |
          pip install -r scripts/mobility-database-harvester/requirements.txt
      - name: Set URL matrix
        id: set-matrix
        run: |
          # Feeds are grouped into jobs of similar size. Jobs holding a feed above the threshold
          # run on the large runner; the others run on the free runner.
          DATASETS=$(python3 scripts/mobility-database-harvester/harvest_latest_versions.py -d scripts/mobility-database-harvester/datasets_metadata -l gtfs_latest_versions.json --feeds "$FEED_LIST" --small-runner ubuntu-24.04 --large-runner ubuntu-latest-4-cores --large-feed-threshold-mb 50)
          echo $DATASETS
          echo "matrix=$DATASETS" >> $GITHUB_OUTPUT
        env:
          FEED_LIST: ${{ inputs.feed_list || 'acceptance' }}
      - name: Persist metadata
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: datasets_metadata
          path: scripts/mobility-database-harvester/datasets_metadata
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
  get-reports:
    needs: [ fetch-urls, pack-master, pack-snapshot ]
    # Large feeds can consume too much heap for default machine instances (see #1304), so jobs
    # holding them run on larger machines. The runner for each job is chosen in fetch-urls.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.fetch-urls.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download .jar file from master branch
        uses: actions/download-artifact@v8
        with:
          name: gtfs-validator-master
          path: gtfs-validator-master
      - name: Download latest changes .jar file from previous job
        uses: actions/download-artifact@v8
        with:
          name: gtfs-validator-snapshot
          path: gtfs-validator-snapshot
      # Master's reports from earlier runs on the same master commit, stored by feed file hash.
      # Feeds whose file is unchanged reuse them instead of running the master validator again.
      # A manual run with reuse_master_reports off skips them.
      - name: Restore master reports from earlier runs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_master_reports }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: master-reports-cache
          key: master-reports-${{ needs.pack-master.outputs.master_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: master-reports-${{ needs.pack-master.outputs.master_sha }}-
      - name: Run validators on queued URLs
        run: |
          queue="${{ matrix.data }}"
          bash ./scripts/queue_runner.sh --include-master $queue
        env:
          OUTPUT_BASE: ${{ github.sha }}
          MASTER_REPORTS_CACHE: ${{ github.workspace }}/master-reports-cache
          MASTER_REPORTS_OUT: ${{ github.workspace }}/master-reports-out
          RUNNER_LABEL: ${{ matrix.runner }}
          FRESH_MASTER_PERCENT: 25
      - name: Persist reports
        uses: actions/upload-artifact@v7.0.2
        with:
          # The attempt number keeps a re-run from merging the previous attempt's artifacts,
          # including its reports_all, which would put every feed's reports in twice.
          name: reports_${{ github.run_attempt }}_${{ strategy.job-index }}
          path: ${{ github.sha }}/output
          retention-days: 1
      # Only collected by save-master-reports, which skips a baseline other than master.
      - name: Persist master reports for reuse
        if: ${{ !inputs.baseline_ref }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: master_reports_${{ strategy.job-index }}
          path: master-reports-out
          if-no-files-found: ignore
          retention-days: 1
  save-master-reports:
    # Collects master's reports from every validation job into one cache entry for this master
    # commit, on top of the previous entry, so later runs can reuse them.
    needs: [ pack-master, get-reports ]
    # A baseline other than master is not saved, so that it does not evict master's reports from
    # the cache.
    if: ${{ !cancelled() && needs.pack-master.result == 'success' && !inputs.baseline_ref }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Restore master reports from earlier runs
        uses: actions/cache/restore@v6.1.0
        with:
          path: master-reports-cache
          key: master-reports-${{ needs.pack-master.outputs.master_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: master-reports-${{ needs.pack-master.outputs.master_sha }}-
      - name: Add master reports from this run
        uses: actions/download-artifact@v8
        with:
          pattern: master_reports_*
          path: master-reports-cache
          merge-multiple: true
      - name: Save master reports
        uses: actions/cache/save@v6.1.0
        with:
          path: master-reports-cache
          key: master-reports-${{ needs.pack-master.outputs.master_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The per-job artifacts are now in the cache, so they are deleted instead of being kept until
      # they expire. This is best effort: the token of a PR from a fork cannot delete artifacts, and
      # those left over expire after a day.
      - name: Delete the per-job master reports artifacts
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("master_reports_")) | .id' \
            | while read -r id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" \
                  || echo "Could not delete artifact $id, it will expire on its own."
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  merge-reports-artifacts:
     runs-on: ubuntu-24.04
     needs: [ get-reports ]
     steps:
       # A failed deletion of the merged artifacts does not fail the job: they expire after a day.
       - name: Merge Artifacts
         id: merge
         continue-on-error: true
         uses: actions/upload-artifact/merge@v7.0.2
         with:
           name: reports_all
           pattern: reports_${{ github.run_attempt }}_*
           delete-merged: true
       - name: Fail if reports_all was not uploaded
         if: ${{ steps.merge.outputs.artifact-id == '' }}
         run: exit 1
  compare-outputs:
    needs: [ pack-master, pack-snapshot, merge-reports-artifacts ]
    runs-on: ubuntu-24.04
    env:
      # Public bucket, readable by link but not listable, where a manual run uploads the HTML and
      # JSON validation reports, the HTML ones linked from the notice comparison CSV. Skipped
      # without the service account key.
      REPORTS_BUCKET: mobilitydata-validation-reports
      UPLOAD_REPORTS: ${{ github.event_name == 'workflow_dispatch' && secrets.GCP_ACCEPTANCE_REPORTS_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download comparator .jar file from previous job
        uses: actions/download-artifact@v8
        with:
          name: comparator-snapshot
      - name: Retrieve reports from previous job
        uses: actions/download-artifact@v8
        with:
          name: reports_all
      - name: Retrieve gtfs latest versions from previous job
        uses: actions/download-artifact@v8
        with:
          name: datasets_metadata
      - name: Generate acceptance report test
        run: |
          java -jar output-comparator*.jar \
           --report_directory . \
           --source_urls gtfs_latest_versions.json \
           --new_error_threshold 1 \
           --percent_invalid_datasets_threshold 1 \
           --percent_corrupted_sources 2 \
           --reference_report_name reference.json \
           --latest_report_name latest.json \
           --output_base acceptance-test-output \
           --commit_sha "${{ needs.pack-snapshot.outputs.latest_sha }}" \
           --reference_commit_sha "${{ needs.pack-master.outputs.master_sha }}" \
           --run_id ${{github.run_id}}
      - name: Write a summary if the comparator wrote none
        if: always()
        run: |
          if [ ! -s acceptance-test-output/acceptance_report_summary.md ]; then
            mkdir -p acceptance-test-output
            {
              echo "## :x: The acceptance test comparator stopped before writing its report"
              echo
              echo "See the _Generate acceptance report test_ step in the [run logs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for the error. The validation reports are in the \`reports_all\` artifact."
            } > acceptance-test-output/acceptance_report_summary.md
          fi
      - name: Authenticate to Google Cloud to upload the validation reports
        if: ${{ always() && env.UPLOAD_REPORTS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_ACCEPTANCE_REPORTS_SA_KEY }}
      - name: Set up the Google Cloud CLI
        if: ${{ always() && env.UPLOAD_REPORTS == 'true' }}
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v3.0.1
      # Only the feeds' HTML and JSON validation reports, not other files of the checkout.
      - name: Upload the validation reports
        id: upload-reports
        if: ${{ always() && env.UPLOAD_REPORTS == 'true' }}
        continue-on-error: true
        run: |
          staging=$(mktemp -d)
          for feed in $(jq -r 'keys[]' gtfs_latest_versions.json); do
            for report in reference.html latest.html reference.json latest.json; do
              if [ -f "$feed/$report" ]; then
                mkdir -p "$staging/$feed"
                cp "$feed/$report" "$staging/$feed/"
              fi
            done
          done
          path="acceptance/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gcloud storage rsync --recursive "$staging" "gs://$REPORTS_BUCKET/$path"
          echo "url=https://storage.googleapis.com/$REPORTS_BUCKET/$path" >> "$GITHUB_OUTPUT"
      - name: Export the notice comparison to CSV
        if: always()
        continue-on-error: true
        run: |
          mkdir -p acceptance-test-output
          bash scripts/export_notice_diff_csv.sh . gtfs_latest_versions.json acceptance-test-output/notice_comparison.csv "$REPORTS_URL"
        env:
          REPORTS_URL: ${{ steps.upload-reports.outputs.url }}
      - name: Persist acceptance test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: acceptance_test_report
          path: acceptance-test-output
      - name: Write the PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          LATEST_RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)
          export LATEST_RELEASE
          python3 scripts/write_acceptance_pr_comment.py acceptance-test-output/acceptance_report_summary.md pr-comment.md
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # From a file: the comment can exceed the 128 KB limit of an environment variable.
      - name: Comment Pull Request
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: pr-comment.md
          token: ${{ secrets.GITHUB_TOKEN }}
      # A manual run does not comment on any PR: it writes the report to the run summary only.
      - name: Write the report of a manual run to the run summary
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Compared \`${LATEST_REF:-$GITHUB_REF_NAME}\` ($LATEST_SHA) with \`${BASELINE_REF:-master}\` ($BASELINE_SHA)." >> "$GITHUB_STEP_SUMMARY"
          cat acceptance-test-output/acceptance_report_summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          LATEST_REF: ${{ inputs.latest_ref }}
          LATEST_SHA: ${{ needs.pack-snapshot.outputs.latest_sha }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          BASELINE_SHA: ${{ needs.pack-master.outputs.master_sha }}
