name: Rule acceptance tests
on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'Dockerfile'
      - '.gitignore'
      - 'LICENSE'
      - 'docker.yml'
      - 'formatting.yml'
      - 'test_pack_dock.yml'
      - 'triage.yml'
      - 'end_to_end.yml'
      - 'web/**'
      - '.github/workflows/web_**.yml'
      - '.github/workflows/stg_web_**.yml'
    types: [ opened, synchronize, reopened, ready_for_review ]
  # Manual runs, on a PR's branch, can validate every feed with master again so that all the
  # timings are compared within one job.
  workflow_dispatch:
    inputs:
      reuse_master_reports:
        description: 'Reuse master reports of unchanged feeds from earlier runs'
        type: boolean
        default: true
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  python_version: '3.11'
  java_version: '17'
  java_distribution: 'zulu'

jobs:
  fail_if_pull_request_is_draft: # Fails in order to indicate that pull request needs to be marked as ready to review to pass.
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Fail if PR is a draft
        run: exit 1
  pre_ci:
    name: Prepare CI environment
    # Skip this job and its dependencies if the PR is draft. Manual runs have no PR.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1
        with:
          # We need to fetch with a depth of 2 for pull_request so we can do HEAD^2
          fetch-depth: 2

        # If this workflow was triggered by a pull request (open or synchronize!) then resolve the commit message from HEAD^2
        # It is stored in output steps, to be referenced with ${{ steps.pr_get_commit_message.outputs.pr_commit_message }}
      - name: "[Pull Request] Get commit message"
        if: github.event_name == 'pull_request'
        id: pr_get_commit_message
        # Obtain the last commit from the branch to merge (hence the HEAD^2).
        # In case of multi-line commit messages, remove any \n, because the GITHUB_OUTPUT method
        # of sending data to other jobs does not like them.
        run: echo "pr_commit_message=$(git log --format=%B -n 1 HEAD^2 | tr '\n' ' ')" >> $GITHUB_OUTPUT

    # For **Pull Request** events this will resolve to something like "$( [ -z "commit message pr" ] && echo "" || echo "commit message pr" )" which then resolves to just "commit message pr"
    outputs:
      commit_message: $( [ -z "${{ steps.pr_get_commit_message.outputs.pr_commit_message }}" ] || echo "${{ steps.pr_get_commit_message.outputs.pr_commit_message }}" )
  pack-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK ${{ env.java_version }}-${{ env.java_distribution }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.java_version }}
          distribution: ${{ env.java_distribution }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Package cli app jar with Gradle
        run: ./gradlew shadowJar
      - name: Persist gtfs-validator snapshot jar
        uses: actions/upload-artifact@v6
        with:
          name: gtfs-validator-snapshot
          path: cli/build/libs/gtfs-validator-*-cli.jar
      - name: Persist comparator snapshot jar
        uses: actions/upload-artifact@v6
        with:
          name: comparator-snapshot
          path: output-comparator/build/libs/output-comparator-*-cli.jar
  pack-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - name: Record master commit
        id: master-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK ${{ env.java_version }}-${{ env.java_distribution }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.java_version }}
          distribution: ${{ env.java_distribution }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Package cli app jar with Gradle
        run: ./gradlew shadowJar
      - name: Persist gtfs-validator jar from master branch
        uses: actions/upload-artifact@v6
        with:
          name: gtfs-validator-master
          path: cli/build/libs/gtfs-validator-*-cli.jar
    outputs:
      master_sha: ${{ steps.master-commit.outputs.sha }}
  fetch-urls:
    if: "!contains(needs.pre_ci.outputs.commit_message, '[acceptance test skip]')"
    needs: pre_ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.python_version }}
      - name: Install dependencies
        run: |
          pip install -r scripts/mobility-database-harvester/requirements.txt
      - name: Set URL matrix
        id: set-matrix
        run: |
          # Feeds are grouped into jobs of similar size. Jobs holding a feed above the threshold
          # run on the large runner; the others run on the free runner.
          DATASETS=$(python3 scripts/mobility-database-harvester/harvest_latest_versions.py -d scripts/mobility-database-harvester/datasets_metadata -l gtfs_latest_versions.json --small-runner ubuntu-24.04 --large-runner ubuntu-latest-4-cores --large-feed-threshold-mb 50)
          echo $DATASETS
          echo "matrix=$DATASETS" >> $GITHUB_OUTPUT
      - name: Persist metadata
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: datasets_metadata
          path: scripts/mobility-database-harvester/datasets_metadata
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
  get-reports:
    needs: [ fetch-urls, pack-master, pack-snapshot ]
    # Large feeds can consume too much heap for default machine instances (see #1304), so jobs
    # holding them run on larger machines. The runner for each job is chosen in fetch-urls.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.fetch-urls.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download .jar file from master branch
        uses: actions/download-artifact@v8
        with:
          name: gtfs-validator-master
          path: gtfs-validator-master
      - name: Download latest changes .jar file from previous job
        uses: actions/download-artifact@v8
        with:
          name: gtfs-validator-snapshot
          path: gtfs-validator-snapshot
      # Master's reports from earlier runs on the same master commit, stored by feed file hash.
      # Feeds whose file is unchanged reuse them instead of running the master validator again.
      # A manual run with reuse_master_reports off skips them.
      - name: Restore master reports from earlier runs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_master_reports }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: master-reports-cache
          key: master-reports-${{ needs.pack-master.outputs.master_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: master-reports-${{ needs.pack-master.outputs.master_sha }}-
      - name: Extract and concatenate IDs
        run: |
          concatenated_ids=$(bash ./scripts/extract_ids.sh '${{ matrix.data }}')
          echo "CONCATENATED_IDS=$concatenated_ids" >> $GITHUB_ENV
          echo "CONCATENATED_IDS=$concatenated_ids"
      - name: Run validators on queued URLs
        run: |
          queue="${{ matrix.data }}"
          bash ./scripts/queue_runner.sh --include-master $queue
        env:
          OUTPUT_BASE: ${{ github.sha }}
          MASTER_REPORTS_CACHE: ${{ github.workspace }}/master-reports-cache
          MASTER_REPORTS_OUT: ${{ github.workspace }}/master-reports-out
          RUNNER_LABEL: ${{ matrix.runner }}
          FRESH_MASTER_PERCENT: 25
      - name: Persist reports
        uses: actions/upload-artifact@v6
        with:
          # The attempt number keeps a re-run from merging the previous attempt's artifacts,
          # including its reports_all, which would put every feed's reports in twice.
          name: reports_${{ github.run_attempt }}_${{ env.CONCATENATED_IDS }}
          path: ${{ github.sha }}/output
      - name: Persist master reports for reuse
        uses: actions/upload-artifact@v6
        with:
          name: master_reports_${{ strategy.job-index }}
          path: master-reports-out
          if-no-files-found: ignore
          retention-days: 1
  save-master-reports:
    # Collects master's reports from every validation job into one cache entry for this master
    # commit, on top of the previous entry, so later runs can reuse them.
    needs: [ pack-master, get-reports ]
    if: ${{ !cancelled() && needs.pack-master.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Restore master reports from earlier runs
        uses: actions/cache/restore@v6.1.0
        with:
          path: master-reports-cache
          key: master-reports-${{ needs.pack-master.outputs.master_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: master-reports-${{ needs.pack-master.outputs.master_sha }}-
      - name: Add master reports from this run
        uses: actions/download-artifact@v8
        with:
          pattern: master_reports_*
          path: master-reports-cache
          merge-multiple: true
      - name: Save master reports
        uses: actions/cache/save@v6.1.0
        with:
          path: master-reports-cache
          key: master-reports-${{ needs.pack-master.outputs.master_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  merge-reports-artifacts:
     runs-on: ubuntu-latest
     needs: [ get-reports ]
     steps:
       - name: Merge Artifacts
         uses: actions/upload-artifact/merge@v6
         with:
           name: reports_all
           pattern: reports_${{ github.run_attempt }}_*
           delete-merged: true
  compare-outputs:
    needs: [ merge-reports-artifacts ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download comparator .jar file from previous job
        uses: actions/download-artifact@v8
        with:
          name: comparator-snapshot
      - name: Retrieve reports from previous job
        uses: actions/download-artifact@v8
        with:
          name: reports_all
      - name: Retrieve gtfs latest versions from previous job
        uses: actions/download-artifact@v8
        with:
          name: datasets_metadata
      - name: Generate acceptance report test
        run: |
          java -jar output-comparator*.jar \
           --report_directory . \
           --source_urls gtfs_latest_versions.json \
           --new_error_threshold 1 \
           --percent_invalid_datasets_threshold 1 \
           --percent_corrupted_sources 2 \
           --reference_report_name reference.json \
           --latest_report_name latest.json \
           --output_base acceptance-test-output \
           --commit_sha ${{ github.sha }} \
           --run_id ${{github.run_id}}
      - name: Persist acceptance test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance_test_report
          path: acceptance-test-output
      - name: Generate PR comment
        id: generate-comment
        if: always()
        run: |
          PR_COMMENT=$(< acceptance-test-output/acceptance_report_summary.md)
          echo "PR_COMMENT<<EOF" >> $GITHUB_ENV
          echo "$PR_COMMENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Comment Pull Request
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: thollander/actions-comment-pull-request@v1.0.4
        with:
          message: ${{ env.PR_COMMENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A manual run comments on the open PR of its branch, if there is one, and always writes the
      # report to the run summary.
      - name: Comment Pull Request of a manual run
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          cat acceptance-test-output/acceptance_report_summary.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --body-file acceptance-test-output/acceptance_report_summary.md \
            || echo "No open pull request for $GITHUB_REF_NAME, the report is in the run summary."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
